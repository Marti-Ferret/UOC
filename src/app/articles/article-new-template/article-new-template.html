<div class="max-w-md mt-2 p-2 border rounded">
  <h2 class="text-xl font-semibold mb-4">Nou article</h2>

  <form #articleForm="ngForm" (ngSubmit)="onSubmit(articleForm)">
    <div ngModelGroup="article">

      <div class="flex flex-col mb-2">
        <label class="mb-1">Nom</label>
        <input class="border" name="name" ngModel required #name="ngModel" placeholder="Ex: Auriculars gaming">
        <span class="text-red-500 text-sm" *ngIf="name.invalid && (name.dirty || name.touched || articleForm.submitted)">
          El nom és obligatori
        </span>
      </div>

      <div class="flex flex-col mb-4">
        <label class="mb-1">Preu</label>
        <input class="border" name="price" ngModel required type="number" #price="ngModel" placeholder="0.00">
        <span class="text-red-500 text-sm" *ngIf="price.invalid && (price.dirty || price.touched || articleForm.submitted)">
          El preu és obligatori
        </span>
      </div>

      <div class="flex flex-col mb-4">
        <label class="mb-1">URL</label>
        <input class="border " name="imageUrl" ngModel required
          pattern="https?://[a-zA-Z0-9]+(\.?[a-zA-Z0-9]+)*\.[a-zA-Z]{2,3}(/[^\s]*)?"
          #imageUrl="ngModel" placeholder="https://...">
        <span class="text-red-500 text-sm" *ngIf="imageUrl.errors?.['required'] && (imageUrl.dirty || imageUrl.touched || articleForm.submitted)">
          La URL és obligatòria
        </span>
        <span class="text-red-500 text-sm" *ngIf="imageUrl.errors?.['pattern'] && (imageUrl.dirty || imageUrl.touched || articleForm.submitted)">
          La URL no és vàlida
        </span>
      </div>

      <div class="flex items-center gap-2 mb-4">
        <input name="isOnSale" ngModel type="checkbox">
        <label>En venda</label>
      </div>

    </div>

    <button class="bg-blue-500 text-white px-4 py-2 rounded" type="submit">Crear article</button>
  </form>
</div>
